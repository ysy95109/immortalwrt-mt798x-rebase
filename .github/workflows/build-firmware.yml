name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Preset name from ci/presets/, or 'all'"
        required: true
        default: all
        type: string
      fresh:
        description: "Ignore earlier build state and start a clean build"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: immortalwrt-${{ github.ref }}-${{ inputs.preset }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate build matrix
        id: matrix
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          matrix="$(python3 ci/matrix.py "$PRESET")"
          printf '%s\n' "$matrix" | python3 -m json.tool
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: firmware-state-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CI_INCREMENTAL: '1'
      # rules.mk uses CONFIG_CCACHE_DIR, defaulting to the source tree's .ccache.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev python3 \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq \
            ccache dwarves zstd patch bzip2 perl time

      - name: Identify compatible build state
        id: state
        env:
          PRESET: ${{ matrix.name }}
        run: |
          set -euo pipefail
          python3 ci/checkpoint.py identity "$PRESET" >> "$GITHUB_OUTPUT"

      - name: Find earlier full checkpoint
        id: previous
        if: ${{ !inputs.fresh }}
        env:
          PREFIX: ${{ steps.state.outputs.prefix }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 ci/checkpoint.py discover "$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Download full build checkpoint
        if: ${{ !inputs.fresh && steps.previous.outputs.name != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.previous.outputs.name }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/firmware-state-restore

      - name: Restore complete build state
        if: ${{ !inputs.fresh && steps.previous.outputs.name != '' }}
        env:
          FAMILY: ${{ steps.state.outputs.family }}
          STATE_DOWNLOAD: ${{ runner.temp }}/firmware-state-restore
        run: |
          set -euo pipefail
          python3 ci/checkpoint.py restore "$STATE_DOWNLOAD" "$FAMILY"
          rm -rf -- "$STATE_DOWNLOAD"

      - name: Build firmware
        id: build
        env:
          PRESET: ${{ matrix.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash ci/build.sh "$PRESET" 2>&1 | tee ci-build.log

      - name: Show disk and compiler cache usage
        if: always()
        run: |
          df -h
          du -sh dl .ccache build_dir staging_dir 2>/dev/null || true
          if [[ -x staging_dir/host/bin/ccache ]]; then
            staging_dir/host/bin/ccache --show-stats
          elif command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

      - name: Upload firmware
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware-${{ matrix.name }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: output/${{ matrix.name }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Save intermediate successes even when a later compilation step fails.
      # The archive preserves Unix modes, links and nanosecond timestamps.
      - name: Pack complete build checkpoint
        id: checkpoint
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        env:
          FAMILY: ${{ steps.state.outputs.family }}
          STATE_UPLOAD: ${{ runner.temp }}/firmware-state-save
        run: |
          set -euo pipefail
          if [[ -f .ci-incremental/source-times.json ]]; then
            python3 ci/checkpoint.py pack "$STATE_UPLOAD" "$FAMILY"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Save complete build checkpoint
        if: ${{ !cancelled() && steps.checkpoint.outputs.ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.state.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firmware-state-save/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ matrix.name }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ci-build.log
            .config
            logs/
            output/${{ matrix.name }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
