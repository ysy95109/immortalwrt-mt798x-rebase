name: Build ImmortalWrt Firmware

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "Preset name from ci/presets/, or 'all'"
        required: true
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: immortalwrt-${{ github.ref }}-${{ inputs.preset }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate build matrix
        id: matrix
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          matrix="$(python3 ci/matrix.py "$PRESET")"
          printf '%s\n' "$matrix" | python3 -m json.tool
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # rules.mk uses CONFIG_CCACHE_DIR, defaulting to the source tree's .ccache.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev python3 \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl jq \
            ccache dwarves zstd patch bzip2 perl time

      # Every preset and run has its own save key. Restore prefixes still allow
      # matrix jobs to share downloaded sources without racing to save one key.
      - name: Restore downloads
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: dl
          key: immortalwrt-dl-v1-${{ runner.os }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            immortalwrt-dl-v1-${{ runner.os }}-${{ matrix.name }}-
            immortalwrt-dl-v1-${{ runner.os }}-

      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: immortalwrt-ccache-v1-${{ runner.os }}-${{ matrix.device }}-${{ matrix.name }}-${{ hashFiles('ci/**', 'toolchain/**/Makefile') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            immortalwrt-ccache-v1-${{ runner.os }}-${{ matrix.device }}-${{ matrix.name }}-${{ hashFiles('ci/**', 'toolchain/**/Makefile') }}-
            immortalwrt-ccache-v1-${{ runner.os }}-${{ matrix.device }}-${{ matrix.name }}-
            immortalwrt-ccache-v1-${{ runner.os }}-${{ matrix.device }}-

      - name: Build firmware
        id: build
        env:
          PRESET: ${{ matrix.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash ci/build.sh "$PRESET" 2>&1 | tee ci-build.log

      - name: Show disk and compiler cache usage
        if: always()
        run: |
          df -h
          du -sh dl .ccache build_dir staging_dir 2>/dev/null || true
          if [[ -x staging_dir/host/bin/ccache ]]; then
            staging_dir/host/bin/ccache --show-stats
          elif command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          fi

      - name: Save downloads
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.downloads.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: dl
          key: ${{ steps.downloads.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.ccache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}

      - name: Upload firmware
        if: ${{ success() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firmware-${{ matrix.name }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: output/${{ matrix.name }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: diagnostics-${{ matrix.name }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            ci-build.log
            .config
            logs/
            output/${{ matrix.name }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
